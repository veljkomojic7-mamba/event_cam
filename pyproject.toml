[project]
name = "traffic-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "veljkomojic7-mamba", email = "veljko.mojic7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.3",
    "ultralytics",
    "lap>=0.5.12",
    "supervision",
    "torch",
    "torchvision",
    "google-genai",
]

[project.scripts]
traffic-analysis = "traffic_analysis.cli:main"

[project.optional-dependencies]
gui = [
    "streamlit>=1.50",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# CUDA build of PyTorch so `uv sync` installs the GPU wheel on the target PC.
# Pick the index matching the installed NVIDIA driver (cu128 needs a recent
# driver); change the URL if that differs.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
